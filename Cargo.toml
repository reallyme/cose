[workspace]
resolver = "2"
default-members = ["crates/cose"]
members = ["crates/cose", "crates/proto"]
exclude = ["fuzz", "tools/vector-audit", "tools/vector-goldens"]

[workspace.package]
edition = "2021"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/cose"
publish = false

# One reviewed version requirement governs each external dependency across the
# workspace. Crate-local manifests retain only feature and optionality policy.
[workspace.dependencies]
allocation-counter = "0.8.1"
base64 = "0.23.1"
buffa = { package = "reallyme-buffa", version = "=0.1.2", features = ["json", "zeroize"] }
ciborium = "=0.2.2"
coset = "0.4.2"
criterion = "0.8.2"
half = { version = "2.7.1", default-features = false }
# Independent ISO provider-contract tests only; production primitives use reallyme-crypto.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
reallyme-codec = { version = "0.4.3", default-features = false, features = ["base64url", "cbor", "der", "multikey"] }
reallyme-cose-proto = { version = "0.3.0", path = "crates/proto", default-features = false }
reallyme-crypto = { version = "0.4.2", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wasm-bindgen-test = "0.3.80"
zeroize = "1.9.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
large_include_file = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
missing_errors_doc = "deny"
