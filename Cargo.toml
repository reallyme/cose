[workspace]
resolver = "2"
default-members = ["crates/cose"]
members = ["crates/cose", "crates/proto"]
exclude = ["fuzz", "tools/vector-audit", "tools/vector-goldens"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/reallyme/cose"
publish = false

# One reviewed version requirement governs each external dependency across the
# workspace. Crate-local manifests retain only feature and optionality policy.
[workspace.dependencies]
allocation-counter = "0.8.1"
buffa = { version = "0.9.0", features = ["json"] }
ciborium = "0.2"
coset = "0.4.2"
criterion = "0.8.2"
reallyme-codec = { version = "0.2.1", default-features = false, features = ["base64url", "cbor", "multikey"] }
reallyme-cose-proto = { version = "0.2.1", path = "crates/proto", default-features = false }
reallyme-crypto = { version = "0.3.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen-test = "0.3.76"
zeroize = "1.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
large_include_file = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
missing_errors_doc = "deny"
