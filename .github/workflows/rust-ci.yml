name: Rust CI

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.rust.outputs.verified_sha }}

permissions:
  contents: read

env:
  CARGO_CHECK_EXTERNAL_TYPES_VERSION: 0.5.0
  EXTERNAL_TYPES_NIGHTLY: nightly-2026-09-15
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  WASM_PACK_VERSION: 0.15.1

jobs:
  rust:
    name: fmt, lint, test, feature lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
          fallback: none

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: Install external-type checker
        run: bash scripts/install_external_type_checker.sh .local-tools

      - name: Install external-type checker toolchain
        run: rustup toolchain install "$EXTERNAL_TYPES_NIGHTLY" --profile minimal

      - name: Format
        run: cargo fmt --check

      - name: Check all features
        run: cargo check --locked --workspace --all-features

      - name: Check warnings as errors
        run: cargo check --locked --workspace --all-features
        env:
          RUSTFLAGS: -Dwarnings

      - name: Check structure-only lane
        run: cargo check --locked --workspace --no-default-features
        env:
          RUSTFLAGS: -Dwarnings

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check public external-type provenance
        run: RUSTUP_TOOLCHAIN="$EXTERNAL_TYPES_NIGHTLY" .local-tools/bin/cargo-check-external-types check-external-types --manifest-path crates/cose/Cargo.toml --all-features

      - name: Format vector audit tool
        run: cargo fmt --manifest-path tools/vector-audit/Cargo.toml --check

      - name: Clippy vector audit tool
        run: cargo clippy --locked --manifest-path tools/vector-audit/Cargo.toml --all-targets -- -D warnings

      - name: Format vector golden generator
        run: cargo fmt --manifest-path tools/vector-goldens/Cargo.toml --check

      - name: Clippy vector golden generator
        run: cargo clippy --locked --manifest-path tools/vector-goldens/Cargo.toml --all-targets -- -D warnings

      - name: Check allocation ceilings
        run: cargo bench --locked --bench operation_performance --all-features

      - name: Test native lane
        run: cargo nextest run --locked --workspace --no-default-features --features native

      - name: Test all features
        run: cargo nextest run --locked --workspace --all-features

      - name: Test release profile
        run: cargo nextest run --release --locked --workspace --all-features

      - name: Independent vector audit
        run: cargo run --locked --manifest-path tools/vector-audit/Cargo.toml --bin reallyme-cose-vector-audit -- .

      - name: Doc build
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test locked release toolchain
        run: cargo +1.100.0 test --locked --workspace --all-features

      - name: Test COSE at MSRV
        run: cargo +1.100.0 test --locked --package reallyme-cose --all-features

      - name: Test COSE protobuf at MSRV
        run: cargo +1.100.0 test --locked --package reallyme-cose-proto --all-features

      - name: Check native lane
        run: cargo check --locked --workspace --no-default-features --features native

      - name: Check native wire lane
        run: cargo check --locked --workspace --no-default-features --features native,wire

      - name: Check wasm32 lane
        run: cargo check --locked --workspace --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Check wasm32 wire lane
        run: cargo check --locked --workspace --no-default-features --features wasm,wire --target wasm32-unknown-unknown

      - name: Review locked Rust dependencies
        run: cargo +1.100.0 deny --locked --workspace --all-features --config deny.toml check advisories licenses sources

      - name: Check dependency bans
        run: cargo +1.100.0 deny --locked --workspace --all-features --config deny.toml check bans

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install wasm-pack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}
          fallback: none

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}
          fallback: none

      - name: Test COSE_Sign1 in the wasm runtime
        run: wasm-pack test --node crates/cose --no-default-features --features wasm --test test_wasm_sign1

      - name: Test explicit container and ISO contracts in the wasm runtime
        run: wasm-pack test --node crates/cose --no-default-features --features wasm --lib

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
