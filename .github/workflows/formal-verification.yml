name: Formal verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KANI_VERSION: '0.68.0'
      KANI_BUNDLE_SHA256: 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install pinned Kani
        shell: bash
        run: |
          cargo install --locked kani-verifier --version "=$KANI_VERSION"
          bundle="kani-$KANI_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/$bundle" "https://github.com/model-checking/kani/releases/download/kani-$KANI_VERSION/$bundle"
          printf '%s  %s\n' "$KANI_BUNDLE_SHA256" "$RUNNER_TEMP/$bundle" | sha256sum --check --strict
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/$bundle"

      - name: Verify proof obligations
        shell: bash
        run: |
          cargo fetch --locked
          sha256sum Cargo.lock > "$RUNNER_TEMP/workspace-lock.sha256"
          results="$RUNNER_TEMP/verification.json"
          CARGO_NET_OFFLINE=true cargo kani --package reallyme-cose --lib --no-default-features --features native \
            --output-format terse -Z stubbing -Z unstable-options --harness-timeout 360s --export-json "$results"
          sha256sum --check --strict "$RUNNER_TEMP/workspace-lock.sha256"
          # Unmet cover goals alone do not fail the verifier. Require the
          # positive and negative scenarios declared by every harness.
          jq --exit-status '
            .verification_results.results as $results
            | ($results | length > 0) and all($results[];
                .status == "Success"
                and ([.checks[] | select(.category == "cover")] as $covers
                  | ($covers | length > 0) and all($covers[]; .status == "Satisfied")))
          ' "$results"

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-verification
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: ignore
