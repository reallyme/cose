name: Formal verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KANI_VERSION: '0.68.0'
      KANI_BUNDLE_SHA256: 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install pinned Kani
        shell: bash
        run: |
          cargo install --locked kani-verifier --version "=$KANI_VERSION"
          bundle="kani-$KANI_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/$bundle" "https://github.com/model-checking/kani/releases/download/kani-$KANI_VERSION/$bundle"
          printf '%s  %s\n' "$KANI_BUNDLE_SHA256" "$RUNNER_TEMP/$bundle" | sha256sum --check --strict
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/$bundle"

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        timeout-minutes: 35
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_formal_obligations.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --

      - name: Summarize proof durations
        if: always()
        shell: bash
        run: |
          results="$RUNNER_TEMP/verification.json"
          if [[ -s "$results" ]]; then
            jq -r '
              .verification_results.results
              | "### Slowest Kani harnesses (\(length) reported)", "",
                "| Harness | Seconds | Result |", "| --- | ---: | --- |",
                (sort_by(.duration_ms) | reverse | .[:10][]
                 | (.duration_ms | if type == "number" then . / 1000 else "n/a" end) as $seconds
                 | "| `\(.harness_id)` | \($seconds) | \(.status) |")
            ' "$results" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Kani did not produce a JSON report. See the verification log in the job artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-verification
          path: |
            ${{ runner.temp }}/verification.json
            ${{ runner.temp }}/verification.log
          if-no-files-found: ignore
