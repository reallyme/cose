name: Crates.io Release

run-name: Crates.io release ${{ inputs.version }} @ ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      preflight_run_id:
        description: Successful Crates Package Preflight run ID that reviewed this release
        required: true
        type: string
      release_sha:
        description: Exact current main commit SHA certified by the preflight run
        required: true
        type: string
      version:
        description: Exact crate version certified by the preflight run
        required: true
        type: string
        default: 0.2.0

concurrency:
  group: crates-release-${{ inputs.version }}-${{ inputs.release_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-preflight:
    name: Verify reviewed package preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.verify-attestation.outputs.release_sha }}
      release_version: ${{ steps.verify-attestation.outputs.release_version }}
    steps:
      - name: Checkout certified release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-cose-crates-preflight-${{ inputs.version }}-${{ inputs.release_sha }}
          path: release-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}

      - name: Verify preflight conclusion, commit, and reviewed inputs
        id: verify-attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: '1'
        run: node scripts/verify_release_attestation.mjs

      - name: Summarize release authorization
        env:
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo '## Reviewed preflight accepted'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Preflight run ID: \`${PREFLIGHT_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish reallyme-cose crates
    needs: verify-preflight
    runs-on: ubuntu-24.04
    environment: crates-io-release
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout certified release commit without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Revalidate current main immediately before publication
        run: node scripts/verify_release_source.mjs

      - name: Publish crates in reviewed dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish_crates_in_order.mjs publish

      - name: Summarize crates.io publication
        run: |
          {
            echo '## crates.io publication completed'
            echo
            echo "- [reallyme-cose-proto ${RELEASE_VERSION}](https://crates.io/crates/reallyme-cose-proto/${RELEASE_VERSION})"
            echo "- [reallyme-cose ${RELEASE_VERSION}](https://crates.io/crates/reallyme-cose/${RELEASE_VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Tag and create GitHub release
    needs: [verify-preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="reallyme-cose-v${RELEASE_VERSION}"
          existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo "$tag already exists at a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
