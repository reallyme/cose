name: Crates.io Release

run-name: Crates.io release @ ${{ github.sha }}

on:
  workflow_dispatch:

concurrency:
  group: crates-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-preflight:
    name: Verify reviewed package preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      preflight_run_id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
    steps:
      - name: Checkout current main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve current release SHA and version
        id: verify-source
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_SOURCE_DERIVE_VERSION: '1'
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: '1'
        run: node scripts/verify_release_source.mjs

      - name: Resolve latest reviewed package preflight
        id: resolve-attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_RESOLVE_ONLY: '1'
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: '1'
          RELEASE_ATTESTATION_WAIT_SECONDS: '3600'
          RELEASE_ATTESTATION_POLL_SECONDS: '20'
        run: node scripts/verify_release_attestation.mjs

      - name: Download latest reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-cose-crates-preflight-${{ steps.verify-source.outputs.release_version }}-${{ steps.verify-source.outputs.release_sha }}
          path: release-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}

      - name: Verify preflight conclusion, commit, version, and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_WAIT_SECONDS: '60'
          RELEASE_ATTESTATION_POLL_SECONDS: '10'
        run: node scripts/verify_release_attestation.mjs

      - name: Summarize release authorization
        env:
          PREFLIGHT_RUN_ID: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
        run: |
          {
            echo '## Reviewed preflight accepted'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Preflight run ID: \`${PREFLIGHT_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish reallyme-cose crates
    needs: verify-preflight
    runs-on: ubuntu-24.04
    concurrency:
      group: crates-release-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
      cancel-in-progress: false
    environment: crates-io-release
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout certified release commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Revalidate current main immediately before publication
        run: node scripts/verify_release_source.mjs

      - name: Publish crates in reviewed dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish_crates_in_order.mjs publish

      - name: Summarize crates.io publication
        run: |
          {
            echo '## crates.io publication completed'
            echo
            echo "- [reallyme-cose-proto ${RELEASE_VERSION}](https://crates.io/crates/reallyme-cose-proto/${RELEASE_VERSION})"
            echo "- [reallyme-cose ${RELEASE_VERSION}](https://crates.io/crates/reallyme-cose/${RELEASE_VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Tag and create GitHub release
    needs: [verify-preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="reallyme-cose-v${RELEASE_VERSION}"
          existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo "$tag already exists at a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
