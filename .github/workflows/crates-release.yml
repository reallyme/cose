name: Crates.io Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: true
        type: string
      source_sha:
        description: Copy the full source SHA from this ecosystem's successful package preflight summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Validate source selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            gh api --hostname github.com "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA?per_page=1" |
              jq -e '.behind_by == 0 and (.status == "ahead" or .status == "identical")' >/dev/null
          fi

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'

      - name: Enforce package release policy
        run: node .release-readiness/scripts/run-consumer-check.mjs --release-packages

      - name: Verify release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: reallyme-cose-v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release crates publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

  publish:
    name: Publish reallyme-cose crates
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.verify.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-package

      - name: Publish crates in reviewed dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          CRATE_ARCHIVE_DIR: ${{ runner.temp }}/release-package
        run: node scripts/publish_crates_in_order.mjs publish

  finalize:
    name: Tag and create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="reallyme-cose-v${RELEASE_VERSION}"
          existing_commit=''
          if resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            existing_commit="$resolved_commit"
          fi
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo "$tag already exists at a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes $'- introduce ISO/IEC 18013-5 signature and signed-container contracts\n- migrate protobuf consumers from manual presence flags to optional fields\n- add bounded formal verification for COSE algorithm selection, authentication inputs, key identity, and ML-KEM recipient handling\n- require Rust 1.100 and update ReallyMe Crypto and Codec to 0.4.4 and Buffa to 0.1.3'
