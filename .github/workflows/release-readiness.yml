name: Release Readiness

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.policy.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: reallyme/release-readiness
          ref: a89da82a662e02ecb3b7cfc6756c450aff64417a
          path: .release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'

      - name: Run release readiness checks
        run: node .release-readiness/scripts/run-consumer-check.mjs
        env:
          COSE_RELEASE_READINESS_POLICY_ONLY: '1'

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
