name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/protobuf-ci.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "scripts/check_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/harden-generated-cose-proto.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/protobuf-ci.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "scripts/check_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/harden-generated-cose-proto.mjs"

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.73.0
  BUF_LINUX_X86_64_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1

jobs:
  protobuf:
    name: lint, generated freshness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install buf
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/buf/bin"
          mkdir -p "$install_dir"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$install_dir/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "$BUF_LINUX_X86_64_SHA256" "$install_dir/buf" \
            | sha256sum --check --strict
          chmod 0755 "$install_dir/buf"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/buf" --version

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 5c2da5e5d5795c2c895d0dca0819287ee7101207
          path: .release-readiness
          persist-credentials: false

      - name: Check release readiness generated freshness
        run: node .release-readiness/scripts/run-consumer-check.mjs --generated-freshness
