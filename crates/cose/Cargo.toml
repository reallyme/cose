[package]
name = "reallyme-cose"
version = "0.2.1"
description = "Strict COSE helpers for ReallyMe identity software."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cose", "cbor", "signing", "identity", "credentials"]
categories = ["cryptography", "encoding"]
publish = true
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.cargo_check_external_types]
# These dependencies deliberately define the cryptographic selector, secret
# owner, and generated wire contract exposed by the supported public API.
allowed_external_types = [
    "crypto_core::algorithm::Algorithm",
    "reallyme_cose_proto::*",
    "zeroize::ZeroizeOnDrop",
    "zeroize::Zeroizing",
]

[features]
default = ["native"]
native = ["cose-crypto", "reallyme-crypto/native"]
wasm = ["cose-crypto", "reallyme-crypto/wasm"]
wire = [
    "dep:buffa",
    "dep:reallyme-cose-proto",
    "dep:serde",
    "dep:serde_json",
]
cose-crypto = [
    "reallyme-crypto/dispatch",
    "reallyme-crypto/aes",
    "reallyme-crypto/aes-kw",
    "reallyme-crypto/csprng",
    "reallyme-crypto/constant-time",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/kmac",
    "reallyme-crypto/ml-kem-512",
    "reallyme-crypto/ml-kem-768",
    "reallyme-crypto/ml-kem-1024",
    "reallyme-crypto/p256",
    "reallyme-crypto/p384",
    "reallyme-crypto/p521",
    "reallyme-crypto/secp256k1",
    "reallyme-crypto/ml-dsa-44",
    "reallyme-crypto/ml-dsa-65",
    "reallyme-crypto/ml-dsa-87",
    "reallyme-crypto/sha2",
    "reallyme-crypto/x25519",
]

[dependencies]
buffa = { workspace = true, optional = true }
ciborium.workspace = true
coset.workspace = true
reallyme-codec.workspace = true
reallyme-cose-proto = { workspace = true, features = ["generated"], optional = true }
reallyme-crypto.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true

[[bench]]
name = "operation_performance"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
