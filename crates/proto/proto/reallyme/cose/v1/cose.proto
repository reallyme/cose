  COSE_COUNTER_SIGNATURE_TARGET_KIND_UNSPECIFIED = 0;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_SIGN = 1;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_SIGN1 = 2;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_SIGNATURE = 3;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_ENCRYPT = 4;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_ENCRYPT0 = 5;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_MAC = 6;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_MAC0 = 7;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_RECIPIENT = 8;
  COSE_COUNTER_SIGNATURE_TARGET_KIND_COUNTERSIGNATURE = 9;
