  // SENSITIVE: standalone full counter structure, optionally tagged 19.
  bytes encoded = 1;
  CoseEnvelopePolicy envelope = 2;
}

message CoseCounterSignatureVerifyRequest {
  CoseCounterSignatureTarget target = 1;
  // signature_index matches header_index, or is zero for standalone counters.
  CoseSignKeyBinding key = 2;
  repeated CoseSignatureSuite allowed_suites = 3;
  // SENSITIVE: explicit counter AAD.
  bytes external_aad = 4;
  oneof signature {
    CoseCounterSignatureEncoded standalone = 5;
    // Select a full counter from target's unprotected header 11. Zero selects
    // the single counter form, or the first member of the collection form.
    uint32 header_index = 6;
