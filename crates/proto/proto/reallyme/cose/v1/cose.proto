message CoseRecipientCreate {
  CoseMessageHeaders headers = 1;
  oneof key_source {
    // SENSITIVE: leaf shared key; never serialized into the recipient.
    bytes key = 2;
    CoseRecipientCreateGroup recipients = 3;
  }
}

// RFC 9052 sections 6.1/6.3. One to 32 recipients in the entire tree, at most
// four layers. Wrapped MAC keys and intermediate wrapped KEKs are generated
// securely; direct keys come from the sole direct recipient at that layer.
message CoseMacCreateRequest {
  CoseMessageHeaders headers = 1;
  // SENSITIVE: attached or detached content.
  bytes payload = 2;
  // SENSITIVE: explicit external AAD, at most 64 KiB.
  bytes external_aad = 3;
  CoseMacAlgorithm algorithm = 4;
  repeated CoseMacAlgorithm allowed_algorithms = 5;
  CoseContentMode content_mode = 6;
  bool tagged = 7;
  repeated CoseRecipientCreate recipients = 8;
  repeated CoseRecipientAlgorithm allowed_recipient_algorithms = 9;
}

// The caller selects a single recipient path, starting at the outer array.
// Unsupported unselected recipient algorithms do not block this path. No
// discovery, identity inference or trust policy is performed by COSE.
message CoseMacVerifyRequest {
  // SENSITIVE: exact message, at most 1 MiB.
  bytes encoded = 1;
  // SENSITIVE: presence requires a nil payload slot.
  optional bytes detached_payload = 2;
  // SENSITIVE: explicit external AAD.
  bytes external_aad = 3;
  CoseMacAlgorithm algorithm = 4;
  repeated CoseMacAlgorithm allowed_algorithms = 5;
  repeated uint32 recipient_path = 6;
  // SENSITIVE: leaf key bound by caller policy to this path.
  bytes recipient_key = 7;
  repeated CoseRecipientAlgorithm allowed_recipient_algorithms = 8;
  CoseEnvelopePolicy envelope = 9;
}

message CoseMacVerifyResult {
  CoseMacAlgorithm algorithm = 1;
  // SENSITIVE: exact authenticated protected headers.
  bytes protected = 2;
  // SENSITIVE: authenticated identity only when protected.
  optional bytes protected_kid = 3;
  // SENSITIVE: present exactly for attached content.
  optional bytes attached_payload = 4;
}

// RFC 9052 sections 5.2/5.3. Keys are exact-width AES-GCM keys, not a KDF
// seed. Supply IV or Partial IV in headers; callers ensure nonce uniqueness.
// Partial IV requires an explicit 12-byte Base IV; both IV forms together fail.
message CoseEncrypt0CreateRequest {
  CoseMessageHeaders headers = 1;
  // SENSITIVE: plaintext.
  bytes plaintext = 2;
  // SENSITIVE: explicit AAD, including empty bytes, at most 64 KiB.
  bytes external_aad = 3;
  CoseContentEncryptionAlgorithm key_algorithm = 4;
  // SENSITIVE: consumed by a protected primitive owner, never returned.
  bytes key = 5;
  repeated CoseContentEncryptionAlgorithm allowed_algorithms = 6;
  // SENSITIVE: Base IV used only with Partial IV, RFC 9052 section 3.1.
  optional bytes base_iv = 7;
  CoseContentMode content_mode = 8;
  bool tagged = 9;
}

message CoseEncrypt0CreateResult {
  // SENSITIVE: exact envelope, nil ciphertext only in detached mode.
  bytes encoded = 1;
  // SENSITIVE: present exactly for detached mode, includes the AEAD tag.
  optional bytes detached_ciphertext = 2;
}

message CoseEncrypt0DecryptRequest {
  // SENSITIVE: exact envelope, at most 1 MiB.
  bytes encoded = 1;
  // SENSITIVE: presence requires a nil ciphertext slot.
  optional bytes detached_ciphertext = 2;
  // SENSITIVE: explicit AAD.
  bytes external_aad = 3;
  CoseContentEncryptionAlgorithm key_algorithm = 4;
  // SENSITIVE: protected primitive input, never returned.
  bytes key = 5;
  repeated CoseContentEncryptionAlgorithm allowed_algorithms = 6;
  // SENSITIVE: explicit base for Partial IV.
  optional bytes base_iv = 7;
  CoseEnvelopePolicy envelope = 8;
}

message CoseEncrypt0DecryptResult {
  // SENSITIVE: released only after AEAD verification succeeds.
  bytes plaintext = 1;
  CoseContentEncryptionAlgorithm algorithm = 2;
  // SENSITIVE: exact authenticated protected-header bytes.
  bytes protected = 3;
  // SENSITIVE: protected identity only; never unprotected discovery data.
  optional bytes protected_kid = 4;
}

message CoseSignSigner {
  CoseMessageHeaders headers = 1;
  CoseSignatureSuite suite = 2;
  // Native primitive encoding; no COSE_Key usage restrictions are discarded.
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes private_key = 3;
}

// RFC 9052 sections 4.1/4.4. One through 32 signers. The context is Signature,
// never Signature1. Payload and AAD are explicit; AAD is at most 64 KiB.
message CoseSignCreateRequest {
  CoseMessageHeaders headers = 1;
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes payload = 2;
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes external_aad = 3;
  CoseContentMode content_mode = 4;
  bool tagged = 5;
  repeated CoseSignSigner signers = 6;
  repeated CoseSignatureSuite allowed_suites = 7;
}

message CoseSignKeyBinding {
  uint32 signature_index = 1;
  CoseSignatureSuite suite = 2;
  // RSA: exact rsaEncryption SubjectPublicKeyInfo DER; curve is UNSPECIFIED.
  // RSA verification requires 2048..8192 modulus bits. Other suites use their
  // established native public-key encodings. No automatic encoding detection.
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes public_key = 3;
}

// Explicit RSA-only Sign1 profile; modern and ISO Sign1 defaults do not change.
// Exact registration, nonempty unique allowed_suites, key index zero and curve
// UNSPECIFIED are required. RSA keys use the SPKI encoding in CoseSignKeyBinding.
// PSS fixes MGF1 to the message hash and salt length to its digest length.
// Limits: 1 MiB encoded/content/authentication structure, 16 KiB/32 headers per
// bucket, 64 KiB AAD, at most 32 allowed suites. RSA signing is unavailable.
// A present detached_payload requires null; absence requires attached bytes.
message CoseRsaSign1VerifyRequest {
  // SENSITIVE: exact received Sign1, optionally tagged 18.
  bytes encoded = 1;
  CoseEnvelopePolicy envelope = 2;
  CoseSignKeyBinding key = 3;
  repeated CoseSignatureSuite allowed_suites = 4;
  // SENSITIVE: exact externally supplied content; explicit empty is meaningful.
  optional bytes detached_payload = 5;
  // SENSITIVE: explicit external AAD, including empty.
  bytes external_aad = 6;
  // SENSITIVE: optional trusted identity, checked against the protected kid.
  optional bytes expected_kid = 7;
}

message CoseRsaSign1VerifyResult {
  CoseSignatureSuite suite = 1;
  // SENSITIVE: exact authenticated protected bytes.
  bytes protected = 2;
  // SENSITIVE: authenticated identity only.
  optional bytes protected_kid = 3;
  // SENSITIVE: present only for attached content, released after verification.
  optional bytes attached_payload = 4;
}

// Verify every signature with exactly one caller-authorized indexed key each.
// No threshold, trust discovery, certificate policy or key selection is inferred.
// A present detached_payload requires a nil slot; absence requires attached bstr.
message CoseSignVerifyRequest {
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes encoded = 1;
  // SENSITIVE: protected ownership and redacted diagnostics.
  optional bytes detached_payload = 2;
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes external_aad = 3;
  CoseEnvelopePolicy envelope = 4;
  repeated CoseSignKeyBinding keys = 5;
  repeated CoseSignatureSuite allowed_suites = 6;
}

message CoseVerifiedSignature {
  uint32 signature_index = 1;
  CoseSignatureSuite suite = 2;
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes protected = 3;
  // SENSITIVE: protected ownership and redacted diagnostics.
  optional bytes protected_kid = 4;
}

message CoseSignVerifyResult {
  // SENSITIVE: protected ownership and redacted diagnostics.
  bytes body_protected = 1;
  // Present only for attached content. Detached content remains caller-owned.
  // SENSITIVE: protected ownership and redacted diagnostics.
  optional bytes attached_payload = 2;
  repeated CoseVerifiedSignature signatures = 3;
}

message CoseKeyFromPublicBytesRequest {
  // Algorithm that determines the COSE_Key kty/crv/alg profile.
  CoseAlgorithmIdentifier algorithm = 1;
  // Raw public key bytes for the selected algorithm.
  // SENSITIVE: identifying bytes; generated owners wipe and redact them.
  bytes public_key = 2;
  // EC2 point encoding. Unspecified preserves the compact default. This field
  // must remain unspecified for non-EC2 algorithms.
  CoseEc2PointEncoding ec2_point_encoding = 3;
}

// CoseKeyFromPrivateBytesRequest builds a private COSE_Key from raw private key
// bytes and matching public key bytes.
message CoseKeyFromPrivateBytesRequest {
  // Algorithm that determines the COSE_Key kty/crv/alg profile.
  CoseAlgorithmIdentifier algorithm = 1;
  // SENSITIVE: raw private key bytes. Callers must keep this in a
  // sensitive-buffer owner outside this transient protobuf container.
  bytes private_key = 2;
  // Optional matching raw public key bytes;
  // supported private-key constructions reject requests that omit it.
  // SENSITIVE: identifying bytes; generated owners wipe and redact them.
  optional bytes public_key = 3;
  reserved 4;
  reserved "has_public_key";
}

// CoseKeyBytesRequest carries encoded COSE_Key bytes for parse, extraction,
// deterministic kid derivation, and Multikey conversion operations.
// A private signature key with explicit key_ops must include sign (1), otherwise
// validation fails with KEY_INVALID_KEY_MATERIAL before private extraction.
// Public verify-only keys remain valid. Omitted key_ops adds no restriction.
message CoseKeyBytesRequest {
  // SENSITIVE: encoded COSE_Key bytes. This may contain private key material
  // for private extraction; wipe transient protobuf containers as soon as
  // practical.
  bytes cose_key = 1;
}

// CoseKeyBytesResult carries encoded COSE_Key bytes or raw key/kid bytes,
// depending on the operation-specific result envelope.
// Rust view: key/owned.rs#CoseKey
message CoseKeyBytesResult {
  // SENSITIVE: operation-specific bytes. For private-key extraction this
  // contains private key material and must be moved into a sensitive-buffer
  // owner by receivers.
  bytes key_bytes = 1;
  // Exact signature registration validated from or encoded into the COSE_Key.
  // Absent for supported non-signature keys and for signature keys whose
  // optional COSE_Key alg parameter was omitted.
  CoseSignatureAlgorithm signature_algorithm = 2;
  reserved 3;
  reserved "has_signature_algorithm";
}

// CoseMultikeyToCoseKeyRequest converts a Multikey string into a public
// COSE_Key.
message CoseMultikeyToCoseKeyRequest {
  // Multikey string to parse.
  // SENSITIVE: identifying bytes; generated owners wipe and redact them.
  string multikey = 1;
}

// CoseMultikeyResult contains a Multikey string produced from a public COSE_Key.
message CoseMultikeyResult {
  // Multikey string.
  // SENSITIVE: identifying bytes; generated owners wipe and redact them.
  string multikey = 1;
}

// CoseErrorReason is the component-owned reason-code enum for reallyme/cose.
// Values are stable public boundary codes; internal Rust errors must map into
// one of these before crossing RPC, SDK, FFI, storage, audit, or telemetry
// boundaries. Numeric bands keep evolving failure families adjacent without
// forcing unrelated public wire values to move.
// Rust view: error.rs#CoseError
enum CoseErrorReason {
  COSE_ERROR_REASON_UNSPECIFIED = 0;
  reserved 1 to 37;

  // Common COSE binary and CBOR boundary failures: 100-199.
  // Rust reason aliases: Malformed, MalformedCbor
  // Rust error alias: Cbor
  COSE_ERROR_REASON_COMMON_CBOR = 100;
  // Rust reason aliases: InvalidStructure
  // Rust error alias: InvalidFormat
  COSE_ERROR_REASON_COMMON_INVALID_FORMAT = 101;
  // Rust reason aliases: Limit, ResourceLimitExceeded
  // Rust error alias: ResourceLimitExceeded
  COSE_ERROR_REASON_COMMON_RESOURCE_LIMIT_EXCEEDED = 102;
  // Rust reason aliases: Encoding, NonCanonicalCbor
  // Rust error alias: NonCanonicalCbor
  COSE_ERROR_REASON_COMMON_NON_CANONICAL_CBOR = 103;
  // Rust reason aliases: UnexpectedTag
  // Rust error alias: UnexpectedCborTag
  COSE_ERROR_REASON_COMMON_UNEXPECTED_CBOR_TAG = 104;
  // Rust reason aliases: Duplicate, DuplicateHeader
  // Rust error alias: DuplicateMapLabel
  COSE_ERROR_REASON_COMMON_DUPLICATE_MAP_LABEL = 105;
  COSE_ERROR_REASON_COMMON_MALFORMED_PROTOBUF = 120;
  COSE_ERROR_REASON_COMMON_MALFORMED_JSON = 121;
  COSE_ERROR_REASON_COMMON_INVALID_PARAMETER = 130;
  COSE_ERROR_REASON_COMMON_INVALID_LENGTH = 131;
  COSE_ERROR_REASON_COMMON_INVALID_ENCODING = 132;
  // Rust reason aliases: MissingProtectedAlgorithm
  COSE_ERROR_REASON_COMMON_MISSING_PROTECTED_ALGORITHM = 133;
  // Rust reason aliases: AuthenticationFailed
  COSE_ERROR_REASON_COMMON_AUTHENTICATION_FAILED = 134;

  // Provider failures: 200-299.
  // Rust reason aliases: Algorithm, UnsupportedAlgorithm
  // Rust error alias: UnsupportedAlgorithm
  COSE_ERROR_REASON_COMMON_UNSUPPORTED_ALGORITHM = 200;
  // Rust reason aliases: Provider, ProviderUnavailable
  // Rust error alias: ProviderUnavailable
  // Rust error alias: Unavailable
  COSE_ERROR_REASON_PROVIDER_UNAVAILABLE = 201;
  // Rust reason aliases: ThumbprintAlgorithm
  COSE_ERROR_REASON_PROVIDER_UNSUPPORTED_THUMBPRINT_ALGORITHM = 202;

  // Backend failures: 300-399.
  // Rust reason aliases: Backend, BackendFailure
  // Rust error alias: Crypto
  // Rust error alias: Backend
  COSE_ERROR_REASON_COMMON_CRYPTO_FAILED = 300;
  COSE_ERROR_REASON_BACKEND_INTERNAL = 301;
  COSE_ERROR_REASON_BACKEND_RESOURCE_LIMIT_EXCEEDED = 302;

  // COSE_Sign1 failures: 400-499.
  COSE_ERROR_REASON_SIGN1_KID_KEY_MISMATCH = 400;
  // Rust error alias: MissingPayload
  COSE_ERROR_REASON_SIGN1_MISSING_PAYLOAD = 401;
  // Rust error alias: MissingKid
  COSE_ERROR_REASON_SIGN1_MISSING_KID = 402;
  // Rust error alias: KeyNotResolved
  COSE_ERROR_REASON_SIGN1_KEY_NOT_RESOLVED = 403;
  // Rust reason aliases: Critical, UnsupportedCriticalHeader
  // Rust error alias: UnsupportedCriticalHeader
  COSE_ERROR_REASON_SIGN1_UNSUPPORTED_CRITICAL_HEADER = 410;
  // Rust reason aliases: UnprotectedSecurityHeader
  // Rust error alias: UnprotectedHeaderNotAllowed
  COSE_ERROR_REASON_SIGN1_UNPROTECTED_HEADER_NOT_ALLOWED = 411;
  // Rust reason aliases: Authentication
  // Rust error alias: InvalidSignature
  COSE_ERROR_REASON_SIGN1_INVALID_SIGNATURE = 420;
  // Rust error alias: MissingPrivateKey
  COSE_ERROR_REASON_SIGN1_MISSING_PRIVATE_KEY = 421;
  // Rust reason aliases: SignatureEncoding
  // Rust error alias: InvalidSignatureEncoding
  COSE_ERROR_REASON_SIGN1_INVALID_SIGNATURE_ENCODING = 422;

  // COSE_Key material and key-shape failures: 500-599.
  // Rust error alias: MissingKeyMaterial
  COSE_ERROR_REASON_KEY_MISSING_KEY_MATERIAL = 500;
  // Rust reason aliases: Key
  // Rust error alias: InvalidKeyMaterial
  // Rust error alias: InvalidKey
  COSE_ERROR_REASON_KEY_INVALID_KEY_MATERIAL = 501;
  // Rust reason aliases: InvalidKeyLength
  COSE_ERROR_REASON_KEY_INVALID_LENGTH = 502;
  // Rust reason aliases: KeyAlgorithmMismatch
  COSE_ERROR_REASON_KEY_ALGORITHM_MISMATCH = 503;

  // Multikey decoding and COSE_Key conversion failures: 600-699.
  // Rust error alias: InvalidMultikey
  COSE_ERROR_REASON_MULTIKEY_INVALID_MULTIKEY = 600;

  // COSE_Encrypt and COSE_Recipient failures: 700-799.
  // Rust error alias: MissingCiphertext
  COSE_ERROR_REASON_ENCRYPT_MISSING_CIPHERTEXT = 700;
  // Rust error alias: InvalidIv
  COSE_ERROR_REASON_ENCRYPT_INVALID_IV = 701;
  // Rust error alias: InvalidRecipient
  COSE_ERROR_REASON_ENCRYPT_INVALID_RECIPIENT = 702;
  // Rust error alias: MissingEncapsulatedKey
  COSE_ERROR_REASON_ENCRYPT_MISSING_ENCAPSULATED_KEY = 703;
  // Rust error alias: InvalidEncapsulatedKey
  COSE_ERROR_REASON_ENCRYPT_INVALID_ENCAPSULATED_KEY = 704;
  // Rust error alias: AuthenticationFailed
  COSE_ERROR_REASON_ENCRYPT_AUTHENTICATION_FAILED = 720;
  // Rust error alias: KeyUnwrapFailed
  COSE_ERROR_REASON_ENCRYPT_KEY_UNWRAP_FAILED = 721;
  // Rust error alias: KidMismatch
  COSE_ERROR_REASON_ENCRYPT_KID_MISMATCH = 730;
  COSE_ERROR_REASON_ENCRYPT_MISSING_KID = 731;
  COSE_ERROR_REASON_ENCRYPT_UNPROTECTED_HEADER_NOT_ALLOWED = 740;

  // Exact fixed failures from the detached MAC and container contracts.
  // Rust reason aliases: DetachedPayloadRequired
  COSE_ERROR_REASON_MAC0_DETACHED_PAYLOAD_REQUIRED = 809;
  // Rust reason aliases: InvalidTagLength
  COSE_ERROR_REASON_MAC0_INVALID_TAG_LENGTH = 810;
  // Rust reason aliases: Profile
  COSE_ERROR_REASON_CONTAINER_PROFILE = 905;
  // Rust reason aliases: CertificateValidation
  COSE_ERROR_REASON_CONTAINER_CERTIFICATE_VALIDATION = 909;
  // Rust reason aliases: CertificateMismatch
  COSE_ERROR_REASON_CONTAINER_CERTIFICATE_MISMATCH = 910;
  // Rust reason aliases: ThumbprintLength
  COSE_ERROR_REASON_CONTAINER_THUMBPRINT_LENGTH = 912;
  // Rust reason aliases: SigningInput
  COSE_ERROR_REASON_CONTAINER_SIGNING_INPUT = 915;

  // Retired unpublished duplicates; never reuse their identities.
  reserved 800, 801, 802, 803, 804, 805, 806, 807, 808, 811, 812, 813, 814, 815, 816, 900, 901, 902, 903, 904, 906, 907, 908, 911, 913, 914, 916;
  reserved "COSE_ERROR_REASON_MAC0_MALFORMED_CBOR", "COSE_ERROR_REASON_MAC0_NON_CANONICAL_CBOR", "COSE_ERROR_REASON_MAC0_UNEXPECTED_TAG", "COSE_ERROR_REASON_MAC0_INVALID_STRUCTURE", "COSE_ERROR_REASON_MAC0_DUPLICATE_HEADER", "COSE_ERROR_REASON_MAC0_MISSING_PROTECTED_ALGORITHM", "COSE_ERROR_REASON_MAC0_UNSUPPORTED_ALGORITHM", "COSE_ERROR_REASON_MAC0_UNPROTECTED_SECURITY_HEADER", "COSE_ERROR_REASON_MAC0_UNSUPPORTED_CRITICAL_HEADER", "COSE_ERROR_REASON_MAC0_INVALID_KEY_LENGTH", "COSE_ERROR_REASON_MAC0_KEY_ALGORITHM_MISMATCH", "COSE_ERROR_REASON_MAC0_AUTHENTICATION_FAILED", "COSE_ERROR_REASON_MAC0_RESOURCE_LIMIT_EXCEEDED", "COSE_ERROR_REASON_MAC0_PROVIDER_UNAVAILABLE", "COSE_ERROR_REASON_MAC0_BACKEND_FAILURE", "COSE_ERROR_REASON_CONTAINER_MALFORMED", "COSE_ERROR_REASON_CONTAINER_ENCODING", "COSE_ERROR_REASON_CONTAINER_DUPLICATE", "COSE_ERROR_REASON_CONTAINER_CRITICAL", "COSE_ERROR_REASON_CONTAINER_LIMIT", "COSE_ERROR_REASON_CONTAINER_ALGORITHM", "COSE_ERROR_REASON_CONTAINER_KEY", "COSE_ERROR_REASON_CONTAINER_PROVIDER", "COSE_ERROR_REASON_CONTAINER_THUMBPRINT_ALGORITHM", "COSE_ERROR_REASON_CONTAINER_SIGNATURE_ENCODING", "COSE_ERROR_REASON_CONTAINER_AUTHENTICATION", "COSE_ERROR_REASON_CONTAINER_BACKEND";

}

