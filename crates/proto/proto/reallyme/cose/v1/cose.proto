// Family-scoped protobuf selectors identify exact COSE registrations. Their
// positive protobuf values are stable contract identifiers, not the signed
// integers carried in COSE. Names such as ES256 and ESP256 preserve that exact
// protocol distinction even though both use the same P-256 crypto backend.
// Rust closed enum: CoseSignatureAlgorithm
enum CoseSignatureAlgorithm {
  // Rust availability: core
  COSE_SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  reserved 1 to 14;
  // EdDSA: 100-199; elliptic-curve signatures: 200-299;
  // RSA signatures: 300-399; post-quantum signatures: 1000-1099.
  COSE_SIGNATURE_ALGORITHM_ED25519 = 100;
  // Historical primitive selectors remain accepted for wire compatibility
  // and map to the fully specified registrations used before 0.2.2.
  COSE_SIGNATURE_ALGORITHM_ECDSA_P256_SHA256 = 200 [deprecated = true];
  COSE_SIGNATURE_ALGORITHM_ES256 = 201;
  COSE_SIGNATURE_ALGORITHM_ES384 = 212;
  COSE_SIGNATURE_ALGORITHM_ES512 = 222;
  COSE_SIGNATURE_ALGORITHM_EDDSA = 101;
  COSE_SIGNATURE_ALGORITHM_ESP256 = 202;
  COSE_SIGNATURE_ALGORITHM_ECDSA_P384_SHA384 = 210 [deprecated = true];
  COSE_SIGNATURE_ALGORITHM_ESP384 = 211;
  COSE_SIGNATURE_ALGORITHM_ECDSA_P521_SHA512 = 220 [deprecated = true];
  COSE_SIGNATURE_ALGORITHM_ESP512 = 221;
  COSE_SIGNATURE_ALGORITHM_ECDSA_SECP256K1_SHA256 = 230;
  // Verification only. RSA keys use rsaEncryption SPKI DER, never EC points.
  COSE_SIGNATURE_ALGORITHM_PS256 = 300;
  COSE_SIGNATURE_ALGORITHM_PS384 = 301;
  COSE_SIGNATURE_ALGORITHM_PS512 = 302;
  // Historical PKCS#1 v1.5 verification requires an explicit allowlist.
  COSE_SIGNATURE_ALGORITHM_RS256 = 310;
  COSE_SIGNATURE_ALGORITHM_RS384 = 311;
  COSE_SIGNATURE_ALGORITHM_RS512 = 312;
  COSE_SIGNATURE_ALGORITHM_ML_DSA_44 = 1000;
  COSE_SIGNATURE_ALGORITHM_ML_DSA_65 = 1010;
  COSE_SIGNATURE_ALGORITHM_ML_DSA_87 = 1020;
}

enum CoseKeyAgreementAlgorithm {
  COSE_KEY_AGREEMENT_ALGORITHM_UNSPECIFIED = 0;
  reserved 1 to 14;
  // Montgomery-form curves: 100-199.
  COSE_KEY_AGREEMENT_ALGORITHM_X25519 = 100;
}

// Rust closed enum: OptionalKeyPolicy
enum CoseAgreementOptionalParameters {
  COSE_AGREEMENT_OPTIONAL_PARAMETERS_UNSPECIFIED = 0;
  // Enforce supplied alg/key_ops. Signature keys may include Base IV (label 5)
  // only as a byte string: retain it in exact key bytes, never signature input.
  // This subset permits omitted alg and agreement operations 7/8, but implements
  // no ECDH alg registrations.
  COSE_AGREEMENT_OPTIONAL_PARAMETERS_VALIDATE_COSE = 1;
  // Explicit ISO peer policy: ignore unknown positive parameters, never d.
  // Known alg/key_ops still enforce the selected purpose and exact signature
  // registration. Base IV must be a byte string; retain it without using it.
  // As with VALIDATE_COSE, agreement alg is omitted: no ECDH alg is implemented.
  COSE_AGREEMENT_OPTIONAL_PARAMETERS_IGNORE_ISO_OPTIONAL = 2;
}

