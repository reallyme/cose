  bytes private_key = 3;
  repeated CoseSignatureSuite allowed_suites = 4;
  // SENSITIVE: explicit counter AAD.
  bytes external_aad = 5;
}

// Presence selects the single unprotected abbreviated-counter header 12.
message CoseCounterSignatureHeaderSelection {}

message CoseCounterSignature0VerifyRequest {
  CoseCounterSignatureTarget target = 1;
  // Abbreviated counters have a single slot: signature_index must be zero.
  CoseSignKeyBinding key = 2;
  repeated CoseSignatureSuite allowed_suites = 3;
